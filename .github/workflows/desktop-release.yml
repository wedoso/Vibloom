name: Desktop CI and Release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to publish after packaging
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, test, and build
        run: npm run check

      # Explicit software WebGL for the GPU-less runner (Chromium SwiftShader).
      - name: Smoke-test the Electron renderer
        run: |
          npm run build
          xvfb-run --auto-servernum env VIBLOOM_SMOKE_TEST=1 npx electron --no-sandbox --use-gl=angle --use-angle=swiftshader-webgl --enable-unsafe-swiftshader .
          xvfb-run --auto-servernum npx electron --no-sandbox --use-gl=angle --use-angle=swiftshader-webgl --enable-unsafe-swiftshader scripts/smoke-lyrics-timing.mjs
          xvfb-run --auto-servernum npx electron --no-sandbox --use-gl=angle --use-angle=swiftshader-webgl --enable-unsafe-swiftshader scripts/smoke-media-session.mjs
          xvfb-run --auto-servernum npx electron --no-sandbox --use-gl=angle --use-angle=swiftshader-webgl --enable-unsafe-swiftshader scripts/smoke-companions.mjs
          xvfb-run --auto-servernum npx electron --no-sandbox --use-gl=angle --use-angle=swiftshader-webgl --enable-unsafe-swiftshader scripts/smoke-updates.mjs

      - name: Cache vocal separation model
        uses: actions/cache@v4
        with:
          path: .cache/htdemucs.onnx
          key: htdemucs-92e33df61cfc9eb820272aaa62d2ef6dcf4d950d

      - name: Test vocal-driven Live2D mouth movement
        run: |
          mkdir -p .cache
          if [ ! -f .cache/htdemucs.onnx ]; then
            curl --fail --location --retry 3 'https://huggingface.co/timcsy/demucs-web-onnx/resolve/92e33df61cfc9eb820272aaa62d2ef6dcf4d950d/htdemucs_embedded.onnx' --output .cache/htdemucs.onnx
          fi
          xvfb-run --auto-servernum env VIBLOOM_TEST_VOCAL_MODEL=.cache/htdemucs.onnx npx electron --no-sandbox --use-gl=angle --use-angle=swiftshader-webgl --enable-unsafe-swiftshader --disable-features=WebGPUService scripts/smoke-lip-sync.mjs

      - name: Audit production dependencies
        run: npm run audit

  package:
    name: Package ${{ matrix.label }}
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            platform: mac
            os: macos-14
            arch: arm64
            command: npm run desktop:package -- --mac --arm64 --publish never -c.forceCodeSigning=true
            artifact: |
              release/*.dmg
              release/*.zip
              release/*.blockmap
          - label: macOS Intel
            platform: mac
            os: macos-14
            arch: x64
            command: npm run desktop:package -- --mac --x64 --publish never -c.forceCodeSigning=true
            artifact: |
              release/*.dmg
              release/*.zip
              release/*.blockmap
          - label: Windows
            platform: win
            os: windows-latest
            arch: x64
            command: npm run desktop:package -- --win --x64 --publish never
            artifact: |
              release/*.exe
              release/*.blockmap
    runs-on: ${{ matrix.os }}
    env:
      CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ (matrix.platform == 'mac' && secrets.MAC_CSC_LINK != '') || (matrix.platform == 'win' && secrets.WIN_CSC_LINK != '') }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require macOS signing and notarization credentials
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required macOS release credential: $name" >&2
              exit 1
            fi
          done

      - name: Build installers
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "win" && -z "${CSC_LINK:-}" ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          ${{ matrix.command }}

      - name: Verify macOS Developer ID and notarization
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          found=false
          while IFS= read -r -d '' app; do
            found=true
            codesign --verify --deep --strict --verbose=4 "$app"
            signature=$(codesign -dv --verbose=4 "$app" 2>&1)
            grep -F "Authority=Developer ID Application" <<<"$signature"
            grep -F "TeamIdentifier=$APPLE_TEAM_ID" <<<"$signature"
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=4 "$app"
          done < <(find release -maxdepth 3 -type d -name 'Vibloom.app' -print0)
          if [[ "$found" != "true" ]]; then
            echo "No packaged Vibloom.app was found for verification." >&2
            exit 1
          fi

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Vibloom-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.run_number }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download packaged installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare installers and architecture-aware update metadata
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node scripts/prepare-update-release.mjs artifacts release-assets

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          node scripts/write-release-notes.mjs "$RELEASE_TAG" release-notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" release-assets/* --notes-file release-notes.md --title "Vibloom $RELEASE_TAG"
          fi
