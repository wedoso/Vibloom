name: Prepare Version Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-main
  cancel-in-progress: true

jobs:
  release-please:
    name: Update release pull request or create release
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
    steps:
      - name: Run Release Please
        if: env.HAS_RELEASE_PLEASE_TOKEN == 'true'
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Explain required release token
        if: env.HAS_RELEASE_PLEASE_TOKEN != 'true'
        run: echo "Configure the RELEASE_PLEASE_TOKEN Actions secret to enable automatic version pull requests and tagged releases." >> "$GITHUB_STEP_SUMMARY"
