name: Prepare Version Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-main
  cancel-in-progress: true

jobs:
  release-please:
    name: Update release pull request or create release
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Dispatch packaging when using the default token
        if: steps.release.outputs.release_created == 'true' && env.HAS_RELEASE_PLEASE_TOKEN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run desktop-release.yml --ref "$RELEASE_TAG" -f release_tag="$RELEASE_TAG"
